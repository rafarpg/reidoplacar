<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReiDoPlacar - Gerenciar liga</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main>
<h1 id="titulo">Gerenciar liga</h1>
<div class="cartao"><h2>Dados da liga</h2><form id="form">
<label for="nome">Nome da liga</label><input id="nome" required minlength="2" maxlength="100">
<label for="descricao">Descrição (opcional)</label><textarea id="descricao" maxlength="255" rows="3"></textarea>
<button class="botao" type="submit">Salvar</button><p class="erro" id="erro"></p><p class="ok" id="ok"></p></form></div>
<div class="cartao"><h2>Campeonato</h2><p id="texto-camp"></p>
<button class="botao" id="gerar" type="button">Gerar campeonato</button><p class="erro" id="erro-camp"></p>
<table class="tabela" id="tabela-rodadas" hidden><thead><tr><th>Rodada</th><th>Situação</th><th>Ação</th></tr></thead><tbody></tbody></table></div>
<div class="cartao"><h2>Excluir liga</h2><p>Apaga a liga com tudo dentro: participantes, campeonato e palpites. Não dá para desfazer.</p>
<button class="botao perigo" id="excluir" type="button">Excluir liga</button><p class="erro" id="erro-excluir"></p></div>
</main>
<script src="/js/sessao.js"></script><script>sessao.exigirLogin();</script><script src="/js/api.js"></script><script src="/js/util.js"></script><script src="/js/header.js"></script><script src="/js/paginas/gerenciar.js"></script>
</body></html>
