<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReiDoPlacar - Cadastro</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main><div class="cartao">
  <img class="logo-grande" src="/img/logo.png" alt="ReiDoPlacar">
  <h1 class="centro">Criar conta</h1>
  <form id="form">
    <label for="nome">Nome</label><input id="nome" required minlength="2" maxlength="100">
    <label for="email">E-mail</label><input id="email" type="email" required>
    <label for="senha">Senha (mínimo 6 caracteres)</label><input id="senha" type="password" required minlength="6">
    <label for="confirmar">Confirmar senha</label><input id="confirmar" type="password" required>
    <button class="botao" type="submit">Cadastrar</button>
    <p class="erro" id="erro"></p>
  </form>
  <p class="centro">Já tem conta? <a href="/index.html">Entrar</a></p>
</div></main>
<script src="/js/sessao.js"></script><script src="/js/api.js"></script><script src="/js/paginas/cadastro.js"></script>
</body></html>
